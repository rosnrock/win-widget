name: Windows build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    name: Build Windows 11 x64 installer
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      CONFIGURATION: Release
      RUNTIME: win-x64
      PUBLISH_DIR: ${{ github.workspace }}\artifacts\publish
      INSTALLER_DIR: ${{ github.workspace }}\artifacts\installer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WinWidget.sln

      - name: Build
        run: dotnet build WinWidget.sln --configuration $env:CONFIGURATION --no-restore

      - name: Test
        run: dotnet test WinWidget.sln --configuration $env:CONFIGURATION --no-build

      - name: Publish self-contained application
        run: >-
          dotnet publish src/WinWidget/WinWidget.csproj
          --configuration $env:CONFIGURATION
          --runtime $env:RUNTIME
          --self-contained true
          --output $env:PUBLISH_DIR
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Smoke-test application startup
        shell: pwsh
        run: |
          $smokeProfile = Join-Path $env:RUNNER_TEMP "winwidget-startup-smoke"
          $localAppData = Join-Path $smokeProfile "LocalAppData"
          New-Item -ItemType Directory -Force -Path $localAppData | Out-Null
          $previousLocalAppData = $env:LOCALAPPDATA
          $process = $null
          try {
            $env:LOCALAPPDATA = $localAppData
            $process = Start-Process -FilePath "$env:PUBLISH_DIR\WinWidget.exe" -PassThru
            Start-Sleep -Seconds 5
            $process.Refresh()
            $crashLog = Join-Path $localAppData "WinWidget\crash.log"
            if ($process.HasExited) {
              throw "WinWidget exited during startup smoke test with code $($process.ExitCode)."
            }
            if (Test-Path $crashLog) {
              Get-Content $crashLog | Write-Error
              throw "WinWidget created a crash log during startup smoke test."
            }
          }
          finally {
            $env:LOCALAPPDATA = $previousLocalAppData
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Resolve installer version
        shell: pwsh
        run: |
          $version = "0.1.0"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tag must use the format vMAJOR.MINOR.PATCH (for example, v1.2.3)."
            }
            $version = $Matches.version
          }
          "INSTALLER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:INSTALLER_DIR | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DSourceDir=$env:PUBLISH_DIR" `
            "/DAppVersion=$env:INSTALLER_VERSION" `
            "installer\WinWidget.iss"
          if (-not (Test-Path "$env:INSTALLER_DIR\WinWidget-Setup.exe")) {
            throw "Inno Setup did not create WinWidget-Setup.exe"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinWidget-Setup-win-x64
          path: ${{ env.INSTALLER_DIR }}\WinWidget-Setup.exe
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.INSTALLER_DIR }}\WinWidget-Setup.exe
